# Optional PostgreSQL override; see README (Docker).
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: fitconnect
      POSTGRES_PASSWORD: fitconnect-dev
      POSTGRES_DB: fitconnect
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_SPEC: ".[postgres]"
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://fitconnect:fitconnect-dev@database:5432/fitconnect
    depends_on:
      database:
        condition: service_healthy

volumes:
  pg-data:
