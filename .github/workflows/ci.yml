name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitconnect
          POSTGRES_PASSWORD: fitconnect
          POSTGRES_DB: fitconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitconnect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: >-
        postgresql+psycopg://fitconnect:fitconnect@localhost:5432/fitconnect
      JWT_SECRET_KEY: ci-only-secret-not-for-production-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev,postgres]"
      - run: alembic upgrade head
      - run: ruff check app tests
      - run: mypy app
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npx vitest --run
      - run: npm run build
