[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sapphire-fitconnect-backend"
version = "0.1.0"
description = "Sapphire FitConnect wellness API (FastAPI, synchronous SQLAlchemy 2.0)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<0.137",  # 0.137+ wraps include_router in pathless route objects
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "email-validator>=2.1",
  "PyJWT>=2.8",
  "bcrypt>=4.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
otel = [
  "opentelemetry-sdk>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501"]
"tests/test_pipeline_*.py" = ["E501", "S603"]
